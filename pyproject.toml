[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gooddaynews"
version = "0.1.0"
description = "Constructive News AI: daily constructive-news briefing with a grounded RAG chat"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
