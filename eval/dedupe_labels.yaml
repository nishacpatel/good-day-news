# Duplicate-detection labels: is this pair the same real-world event?
#
# Measured on 9 Oct 2026 from the live pipeline (see config/scoring.yaml, cluster_similarity):
#   - "article_to_story": a new article compared with an existing story, the path that merges new coverage.
#   - "story_to_story": the most similar pairs of different published stories, a proxy for near-misses.
# Small sample. Expand with: python -m gooddaynews.evaluation.dedupe_pairs (needs embedding quota).

pairs:
